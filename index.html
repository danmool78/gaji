<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가지 · 실험 동아리 연구 관리</title>
<meta name="description" content="실험이 가지를 치며 이어지는 동아리 연구 관리 도구">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%23C26A00'/%3E%3Cg transform='translate(12 12)' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'%3E%3Ccircle cx='6' cy='5' r='2'/%3E%3Ccircle cx='6' cy='19' r='2'/%3E%3Ccircle cx='18' cy='9' r='2'/%3E%3Cpath d='M6 7v10M18 11c0 4-6 3-12 6'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <div class="layout">
    <div class="main-col">
      <header class="top">
        <button type="button" class="back" id="backBtn" aria-label="뒤로" hidden><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="brand" id="brand">
          <span class="logo" id="clubLogo" aria-hidden="true"></span>
          <div class="brand-text"><b id="clubName">실험 동아리</b><small>가지</small></div>
        </div>
        <h1 class="screen-title" id="screenTitle" hidden></h1>
        <span class="demo-pill" id="demoPill">체험 모드</span>
      </header>
      <main id="screen" class="screen" aria-live="polite"></main>
    </div>
    <aside class="pane" id="pane" hidden aria-label="자세히 보기">
      <header class="top pane-top">
        <button type="button" class="back" id="paneBack" aria-label="뒤로" hidden><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <h1 class="screen-title" id="paneTitle"></h1>
        <button type="button" class="back" id="paneClose" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </header>
      <div id="paneBody" class="screen"></div>
    </aside>
  </div>

  <nav class="tabs" aria-label="메뉴">
    <button type="button" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>홈</button>
    <button type="button" data-tab="tree"><svg viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="9" r="2"/><path d="M6 7v10M18 11c0 4-6 3-12 6"/></svg>가지</button>
    <button type="button" data-tab="find"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>찾기</button>
    <button type="button" data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>더 보기</button>
  </nav>
</div>
<div class="sheet-bg" id="sheetBg" hidden></div>
<section class="sheet" id="sheet" hidden aria-modal="true" role="dialog"></section>
<div class="toast" id="toast" hidden></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
